{% extends "base.html" %}
{% block title %}重設密碼｜{{ site_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block main %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>設定新密碼</h1>
    <p class="muted">密碼至少 8 個字元，需同時包含英文字母與數字。</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="new_password">新密碼</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm_password">再輸入一次</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">更新密碼</button>
    </form>
  </div>
</section>
{% endblock %}
