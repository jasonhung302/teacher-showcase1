{% extends "base.html" %}
{% block title %}忘記密碼｜{{ site_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block main %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>忘記密碼</h1>
    <p class="callout callout-info">請聯絡系統管理員協助重設密碼。管理員會提供一組臨時密碼，您登入後再設定自己的新密碼即可。</p>
    <p class="auth-links"><a href="{{ url_for('auth.login') }}">← 返回登入</a></p>
  </div>
</section>
{% endblock %}
