{% extends "base.html" %}
{% block title %}忘記密碼｜{{ site_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block main %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>忘記密碼</h1>
    <p class="muted">輸入您的帳號或登記的 Email，我們會寄送 30 分鐘內有效的重設連結。</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="identifier">帳號或 Email</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" required autofocus>
      </div>
      <button class="btn btn-primary btn-block" type="submit">寄送重設連結</button>
    </form>
    <p class="auth-links"><a href="{{ url_for('auth.login') }}">← 返回登入</a></p>
  </div>
</section>
{% endblock %}
