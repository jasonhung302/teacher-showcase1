{% extends "base.html" %}
{% block title %}{{ title }}｜{{ site_name }}{% endblock %}
{% block main %}
<section class="container narrow error-page">
  <div class="card center">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    {% if message %}<p>{{ message }}</p>
    {% elif code == 404 %}<p class="muted">頁面不存在、尚未發布，或您沒有權限查看。</p>
    {% elif code == 403 %}<p class="muted">您的帳號沒有權限執行此操作。</p>{% endif %}
    <p><a class="btn btn-primary" href="{{ url_for('public.home') }}">回到首頁</a></p>
  </div>
</section>
{% endblock %}
