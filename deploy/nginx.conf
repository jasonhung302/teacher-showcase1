# /etc/nginx/sites-available/teacher-showcase
# 申請憑證：sudo certbot --nginx -d teacher.example.edu.tw
server {
    listen 80;
    server_name teacher.example.edu.tw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name teacher.example.edu.tw;

    ssl_certificate     /etc/letsencrypt/live/teacher.example.edu.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacher.example.edu.tw/privkey.pem;

    client_max_body_size 25m;          # 需 ≥ PDF_MAX_MB + 2
    server_tokens off;

    location /static/ {
        alias /opt/teacher-showcase/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
